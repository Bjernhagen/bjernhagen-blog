{{ define "main" }}
<section class="page-header">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ if .Content }}<div class="page-intro">{{ .Content }}</div>{{ end }}
</section>

{{ $posts := .Pages.ByDate.Reverse }}
{{ if $posts }}
<div class="post-grid">
  {{ range $posts }}
  {{ partial "postcard.html" . }}
  {{ end }}
</div>
{{ else }}
<p class="empty-state">Inga inlägg i den här kategorin än.</p>
{{ end }}
{{ end }}
